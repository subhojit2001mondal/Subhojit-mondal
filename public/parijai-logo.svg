<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Green Radial Gradient matching the provided image -->
    <radialGradient id="deepGreenBg" cx="48%" cy="46%" r="52%" fx="42%" fy="40%">
      <stop offset="0%" stop-color="#0f4427" />
      <stop offset="35%" stop-color="#09311c" />
      <stop offset="70%" stop-color="#052112" />
      <stop offset="100%" stop-color="#02130a" />
    </radialGradient>

    <!-- Metallic Gold Outer Rim Gradient -->
    <linearGradient id="goldRimOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2" />
      <stop offset="20%" stop-color="#e2b744" />
      <stop offset="45%" stop-color="#9a6e1a" />
      <stop offset="70%" stop-color="#fdf0b0" />
      <stop offset="88%" stop-color="#be8c28" />
      <stop offset="100%" stop-color="#fef6c9" />
    </linearGradient>

    <!-- High-Sheen Gold Gradient for Main "P" and Elements -->
    <linearGradient id="goldPrimary" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fff5c0" />
      <stop offset="25%" stop-color="#e9be4a" />
      <stop offset="50%" stop-color="#b48324" />
      <stop offset="75%" stop-color="#fae388" />
      <stop offset="100%" stop-color="#8e6316" />
    </linearGradient>

    <!-- Highlight Sheen for 3D Bevels -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fbe790" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a6771c" stop-opacity="0.1" />
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="luxuryDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- BACKGROUND: Deep Emerald Forest Green Medallion -->
  <circle cx="250" cy="250" r="236" fill="url(#deepGreenBg)" />

  <!-- Subtle ambient inner light on deep green -->
  <circle cx="235" cy="220" r="190" fill="#12522f" opacity="0.22" />

  <!-- OUTER GOLD BEVELED RIMS -->
  <!-- Outermost Gold Border -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldRimOuter)" stroke-width="12" />
  <!-- Outer Rim Shading Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#68480e" stroke-width="1.5" opacity="0.8" />
  <!-- Inner Delicate Gold Ring -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldPrimary)" stroke-width="2.8" />
  <!-- Ultra-fine Inset Accent Ring -->
  <circle cx="250" cy="250" r="217" fill="none" stroke="#fceda2" stroke-width="0.8" opacity="0.6" />

  <!-- CENTRAL ARTWORK GROUP (Letter "P", Buildings, Leaves) -->
  <g filter="url(#luxuryDropShadow)">

    <!-- MODERN HOTEL HIGH-RISE BUILDINGS (Inside the Loop of the "P") -->
    <g transform="translate(244, 94)">
      <!-- Left Tower -->
      <polygon points="0,55 18,36 18,105 0,105" fill="none" stroke="url(#goldPrimary)" stroke-width="3" />
      <!-- Left Tower Windows -->
      <line x1="6" y1="58" x2="6" y2="100" stroke="url(#goldPrimary)" stroke-width="2" stroke-dasharray="4,4" />
      <line x1="12" y1="52" x2="12" y2="100" stroke="url(#goldPrimary)" stroke-width="2" stroke-dasharray="4,4" />

      <!-- Center Tallest Tower with Angled Penthouse Roof -->
      <polygon points="18,36 38,15 38,110 18,110" fill="none" stroke="url(#goldPrimary)" stroke-width="3.2" />
      <!-- Center Tower Windows -->
      <line x1="24" y1="36" x2="24" y2="105" stroke="url(#goldPrimary)" stroke-width="2.2" stroke-dasharray="4,4" />
      <line x1="32" y1="28" x2="32" y2="105" stroke="url(#goldPrimary)" stroke-width="2.2" stroke-dasharray="4,4" />

      <!-- Right Tower -->
      <polygon points="38,40 58,55 58,110 38,110" fill="none" stroke="url(#goldPrimary)" stroke-width="3" />
      <!-- Right Tower Windows -->
      <line x1="44" y1="50" x2="44" y2="105" stroke="url(#goldPrimary)" stroke-width="2" stroke-dasharray="4,4" />
      <line x1="51" y1="56" x2="51" y2="105" stroke="url(#goldPrimary)" stroke-width="2" stroke-dasharray="4,4" />
    </g>

    <!-- THE GRAND 3D GOLD "P" -->
    <!-- Main Body of "P" with sweeping upper bowl and sculpted stem -->
    <path
      d="M 155,270 
         C 175,270 190,268 190,248 
         L 190,92 
         C 190,75 175,70 158,70 
         L 158,62 
         L 335,62 
         C 378,62 422,90 422,154 
         C 422,216 372,258 316,258 
         C 285,258 260,245 244,232 
         C 228,218 214,196 200,165 
         C 240,165 292,168 324,190 
         C 334,166 335,134 330,115 
         C 324,96 302,86 270,86 
         L 230,86 
         L 230,230 
         C 230,255 242,266 266,270 
         L 155,270 Z"
      fill="url(#goldPrimary)"
    />

    <!-- Sculptural Inner Loop Cutout and Ribbon Accent -->
    <path
      d="M 205,168 
         C 232,168 300,172 332,260 
         C 290,242 245,215 205,168 Z"
      fill="url(#goldRimOuter)"
      opacity="0.9"
    />

    <!-- Sweeping Lower Golden Ribbon Arch of "P" -->
    <path
      d="M 200,168 
         C 235,210 270,246 325,260 
         C 280,244 240,210 200,168 Z"
      fill="#fff2b3"
    />

    <!-- Lower Crescent Wave Tail Under Bowl -->
    <path
      d="M 235,270 
         C 265,262 300,230 318,185 
         C 335,235 295,270 235,270 Z"
      fill="url(#goldPrimary)"
    />

    <!-- THREE LUXURY BOTANICAL TEA / LAUREL LEAVES -->
    <!-- Left Leaf -->
    <path
      d="M 230,240 
         C 200,225 175,200 172,185 
         C 188,198 215,220 230,240 Z"
      fill="url(#goldPrimary)"
    />
    <!-- Center Leaf -->
    <path
      d="M 232,242 
         C 220,205 210,180 202,165 
         C 218,180 230,210 232,242 Z"
      fill="url(#goldRimOuter)"
    />
    <!-- Right Leaf -->
    <path
      d="M 235,245 
         C 240,215 242,192 238,178 
         C 248,195 245,222 235,245 Z"
      fill="url(#goldPrimary)"
    />
    <!-- Stem Connecting Leaves -->
    <path
      d="M 235,270 C 235,255 230,240 225,230"
      fill="none"
      stroke="url(#goldPrimary)"
      stroke-width="3"
    />

  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g filter="url(#luxuryDropShadow)">
    <!-- "PARIJAI" in Grand Roman Serif Typography -->
    <text
      x="250"
      y="348"
      text-anchor="middle"
      font-family="'Fraunces', 'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif"
      font-size="68"
      font-weight="700"
      letter-spacing="5"
      fill="url(#goldPrimary)"
    >
      PARIJAI
    </text>

    <!-- Upper Bevel Highlights on PARIJAI Text -->
    <text
      x="250"
      y="346"
      text-anchor="middle"
      font-family="'Fraunces', 'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif"
      font-size="68"
      font-weight="700"
      letter-spacing="5"
      fill="#ffffff"
      opacity="0.25"
    >
      PARIJAI
    </text>

    <!-- "— GROUP OF HOTELS —" SUB-BANNER -->
    <!-- Left Rule Line -->
    <line x1="85" y1="370" x2="115" y2="370" stroke="url(#goldPrimary)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Subtitle Text -->
    <text
      x="250"
      y="375"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif"
      font-size="16.5"
      font-weight="700"
      letter-spacing="7"
      fill="url(#goldPrimary)"
    >
      GROUP OF HOTELS
    </text>

    <!-- Right Rule Line -->
    <line x1="385" y1="370" x2="415" y2="370" stroke="url(#goldPrimary)" stroke-width="2.5" stroke-linecap="round" />

    <!-- ORNATE BOTTOM CREST / FLEUR-DE-LIS FLOURISH -->
    <g transform="translate(250, 412)">
      <!-- Left Tendril Line -->
      <line x1="-105" y1="0" x2="-22" y2="0" stroke="url(#goldPrimary)" stroke-width="1.8" />
      <!-- Left Leaf Diamond -->
      <polygon points="-55,-3 -50,0 -55,3 -60,0" fill="url(#goldPrimary)" />

      <!-- Center Fleur-de-lis Crest -->
      <!-- Center Upright Petal -->
      <path d="M 0,-18 C -4,-9 -5,-2 0,4 C 5,-2 4,-9 0,-18 Z" fill="url(#goldPrimary)" />
      <!-- Left Curving Petal -->
      <path d="M 0,2 C -10,-2 -16,-10 -15,-14 C -14,-9 -8,-2 0,2 Z" fill="url(#goldPrimary)" />
      <!-- Right Curving Petal -->
      <path d="M 0,2 C 10,-2 16,-10 15,-14 C 14,-9 8,-2 0,2 Z" fill="url(#goldPrimary)" />
      <!-- Center Base Ring -->
      <rect x="-6" y="2" width="12" height="3" rx="1.5" fill="url(#goldPrimary)" />
      <!-- Bottom Point -->
      <polygon points="0,5 -3,8 0,11 3,8" fill="url(#goldPrimary)" />

      <!-- Right Tendril Line -->
      <line x1="22" y1="0" x2="105" y2="0" stroke="url(#goldPrimary)" stroke-width="1.8" />
      <!-- Right Leaf Diamond -->
      <polygon points="55,-3 60,0 55,3 50,0" fill="url(#goldPrimary)" />
    </g>
  </g>
</svg>
